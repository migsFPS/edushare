<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduShare | Reset Password</title>
  <link rel="stylesheet" href="login.css">
  <style>
    .reset-card {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: var(--white);
      border: 1px solid rgba(215, 225, 241, 0.9);
      border-radius: 20px;
      padding: 44px 36px;
      box-shadow: 0 15px 45px rgba(15, 39, 80, 0.13);
    }
    .brand-badge {
      display: inline-block;
      width: 50px;
      height: 50px;
      line-height: 50px;
      background: var(--gold);
      color: var(--navy);
      font-weight: 800;
      font-size: 22px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .text-center {
      text-align: center;
    }
    .reset-card h1 {
      font-size: 26px;
      color: var(--navy);
      margin: 0 0 10px;
    }
    .reset-card p.subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 26px;
    }
    .action-btn {
      display: inline-block;
      width: 100%;
      height: 50px;
      line-height: 50px;
      background: var(--navy);
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      text-align: center;
      transition: background 0.2s;
    }
    .action-btn:hover {
      background: var(--blue);
    }
    .status-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .status-icon.success {
      background: #e6f9f0;
      color: #0d8a55;
    }
  </style>
  <link rel="icon" type="image/png" href="/image/Favicon.png">
</head>
<body>
  <div class="reset-card">
    <div class="text-center">
      <div class="brand-badge">UA</div>
      <div style="font-weight: 700; font-size: 20px; color: var(--navy); margin-bottom: 4px;">EduShare</div>
      <div style="font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 24px;">University of the Assumption</div>
    </div>

    <div id="formSection">
      <h1>Create New Password</h1>
      <p class="subtitle">Enter your new secure password below to regain access to EduShare.</p>

      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="input-box">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2"></rect>
              <path d="M8 10V7a4 4 0 1 1 8 0v3"></path>
              <path d="M12 14v3"></path>
            </svg>
            <input type="password" id="newPassword" name="newPassword" placeholder="At least 8 characters" minlength="8" required>
          </div>
        </div>

        <div class="form-group" style="margin-top: 16px;">
          <label for="confirmPassword">Confirm New Password</label>
          <div class="input-box">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2"></rect>
              <path d="M8 10V7a4 4 0 1 1 8 0v3"></path>
              <path d="M12 14v3"></path>
            </svg>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your new password" minlength="8" required>
          </div>
        </div>

        <div id="resetMessage" class="message" role="status" aria-live="polite" style="margin-top: 14px;"></div>

        <button type="submit" id="submitBtn" class="action-btn" style="margin-top: 20px;">
          Update Password
        </button>
      </form>
    </div>

    <div id="successSection" class="text-center" style="display: none;">
      <div class="status-icon success">✓</div>
      <h1>Password Updated</h1>
      <p id="successNotice" style="color: #486581; font-size: 15px; line-height: 1.6; margin-bottom: 24px;">
        Your password has been successfully updated! You may now sign in with your new password.
      </p>
      <a href="index.html" class="action-btn">GO TO LOGIN</a>
    </div>

    <div style="margin-top: 24px; text-align: center;">
      <a href="index.html" style="color: var(--blue); text-decoration: none; font-weight: 600; font-size: 14px;">
        Back to Login
      </a>
    </div>
  </div>

  <script>
    (() => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      const resetForm = document.getElementById('resetForm');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const resetMessage = document.getElementById('resetMessage');
      const submitBtn = document.getElementById('submitBtn');
      const formSection = document.getElementById('formSection');
      const successSection = document.getElementById('successSection');

      if (!token) {
        resetMessage.className = 'message show error';
        resetMessage.textContent = 'Invalid or missing password reset link. Please request a new link from the login page.';
        submitBtn.disabled = true;
      }

      function showMsg(text, type = 'error') {
        resetMessage.className = 'message show ' + type;
        resetMessage.textContent = text;
      }

      resetForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (!token) {
          return showMsg('Reset token is missing. Please request a new link.');
        }

        const password = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (password.length < 8) {
          return showMsg('Password must be at least 8 characters long.');
        }

        if (password !== confirmPassword) {
          return showMsg('Passwords do not match.');
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating Password...';
        resetMessage.className = 'message';
        resetMessage.textContent = '';

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password, confirmPassword })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            formSection.style.display = 'none';
            successSection.style.display = 'block';
          } else {
            showMsg(data.error || 'Failed to update password. Link may be invalid or expired.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Update Password';
          }
        } catch (err) {
          showMsg('A network error occurred. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
        }
      });
    })();
  </script>
</body>
</html>
